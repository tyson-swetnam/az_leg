name: Data Audit

# Scheduled + on-demand audit of the legislator/official dataset.
#
# Two jobs:
#   1. audit-scripts  — always runs (no secrets needed). Runs the Node audit,
#      uploads audit-report.json, and on a schedule opens/updates a tracking issue.
#   2. claude-audit   — optional. If an ANTHROPIC_API_KEY secret is configured,
#      runs the richer `/audit-all` workflow (sub-agents cross-check rosters
#      against authoritative .gov sources). No-ops cleanly when the secret is
#      absent.

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit mode'
        type: choice
        default: fast
        options: [fast, full]

permissions:
  contents: read
  issues: write

jobs:
  audit-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run data audit
        # Scheduled runs use fast mode (no HTTP); choose "full" via manual dispatch
        # for a complete link crawl.
        run: |
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            npm run audit
          else
            npm run audit:fast
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          if-no-files-found: error

      - name: Open / update tracking issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            const o = report.overall;
            const date = new Date().toISOString().slice(0, 10);
            const gaps = (report.gaps || []).map((g) => {
              if (g.kind === 'missing-area') return `- ❗ Missing **${g.area}**: ${g.found}/${g.expected}`;
              if (g.kind === 'unmatched-committee-member') return `- ⚠️ Committee ${g.chamber}/${g.committee}: "${g.name}" not matched`;
              if (g.kind === 'federal-mapping-orphan') return `- ⚠️ ${g.note}`;
              return `- ${g.kind}`;
            }).join('\n') || '_none_';
            const body = [
              `## Data audit — ${date}`,
              '',
              `- People audited: **${o.totalPeople}**`,
              `- Complete profiles: **${o.complete}/${o.totalPeople}**`,
              `- Verified (official): **${o.verified}/${o.totalPeople}**`,
              `- Unverified: **${o.unverified}/${o.totalPeople}**`,
              '',
              '### Gaps',
              gaps,
              '',
              '_Generated by `.github/workflows/data-audit.yml`. Full report is in the `audit-report` artifact._',
            ].join('\n');
            const title = `Data audit — ${date}`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Data audit —"`,
            });
            const open = existing.data.items[0];
            if (open) {
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, title, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['data-audit'] });
            }

  claude-audit:
    needs: audit-scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - id: check
        # Evaluates to true/false without exposing the secret value.
        run: echo "has_key=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: Deep audit via Claude Code
        if: steps.check.outputs.has_key == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: '/audit-all'
